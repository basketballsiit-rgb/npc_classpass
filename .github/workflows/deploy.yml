name: Deploy NPC ClassPass

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดมาที่ branch main หรือ master หรือกดสั่ง Run ด้วยตนเอง
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: เชื่อมต่อเซิร์ฟเวอร์และอัปเดตระบบ
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        command_timeout: 15m
        # คำสั่งรันบนเซิร์ฟเวอร์เพื่อทำการอัปเดตระบบ Build และรีสตาร์ต PM2
        script: |
          # โหลด Node.js และ npm จาก NVM ของเซิร์ฟเวอร์
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
          
          TARGET_DIR="/var/www/html/npc_classpass"
          
          # ถ้ายังไม่มีโฟลเดอร์ในเซิร์ฟเวอร์ ให้ทำการ clone โปรเจกต์ลงมา
          if [ ! -d "$TARGET_DIR" ]; then
            echo "📁 ไม่พบโฟลเดอร์ $TARGET_DIR กำลังทำการ Clone..."
            sudo mkdir -p "$TARGET_DIR"
            sudo chown -R $USER:$USER "$TARGET_DIR"
            git clone https://github.com/basketballsiit-rgb/npc_classpass.git "$TARGET_DIR"
          fi
          
          cd "$TARGET_DIR"
          echo "🔄 กำลังดึงโค้ดล่าสุดจาก GitHub..."
          git fetch origin
          git reset --hard origin/main || git reset --hard origin/master
          
          echo "📦 ติดตั้ง dependencies..."
          npm install
          
          echo "🏗️ ทำการ Build ระบบ Next.js..."
          npm run build
          
          echo "🚀 รีสตาร์ตระบบด้วย PM2..."
          pm2 restart npc_classpass || pm2 start npm --name "npc_classpass" -- start
          pm2 save
          
          echo "✅ Deploy NPC ClassPass ไปยัง Server สำเร็จเรียบร้อย!"
